<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Halaman Tidak Ditemukan</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0b0f;
    color: #f5f5f5;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .container {
    max-width: 480px;
  }
  h1 {
    font-size: 6rem;
    font-weight: 800;
    letter-spacing: -2px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  p {
    margin-top: 12px;
    font-size: 1.05rem;
    color: #a1a1aa;
    line-height: 1.5;
  }
  a {
    display: inline-block;
    margin-top: 28px;
    padding: 10px 24px;
    border: 1px solid #3f3f46;
    border-radius: 8px;
    color: #f5f5f5;
    text-decoration: none;
    font-size: 0.95rem;
    transition: background 0.2s ease;
  }
  a:hover {
    background: #18181b;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Halaman yang kamu cari tidak ditemukan atau sudah tidak tersedia.</p>
    <a href="/">Kembali ke Beranda</a>
  </div>
</body>
</html>
